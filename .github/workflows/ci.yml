# Constitution (Development Workflow): CI runs the full test suites, linters and dependency
# vulnerability scans. It runs exactly the local merge gate, scripts/check.ps1.
#
# No repository secrets are used: no test calls Claude, Have I Been Pwned or Supabase.
name: ci

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Password of the throwaway PostgreSQL service container below. It only exists for the
  # lifetime of this job and is reachable only from the runner, so it is not a secret.
  PG_CI_PASSWORD: ci-ephemeral

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        # Supabase runs PostgreSQL 17; CI uses the same major version.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ${{ env.PG_CI_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Merge gate
        shell: pwsh
        env:
          MACROCOUNTER_TEST_PG: Host=localhost;Username=postgres;Password=${{ env.PG_CI_PASSWORD }}
          CI: "true"
        run: ./scripts/check.ps1

      # ASVS 14.2.5 (specs/003-auth-security-foundations/checklists/asvs-l2.md G12): a CycloneDX bill of
      # materials for every build, kept as a download on the run. The frontend one includes the build tools.
      - name: Software bill of materials
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force sbom | Out-Null
          dotnet dotnet-CycloneDX backend/MacroCounter.Api/MacroCounter.Api.csproj --output sbom --filename backend.cdx.json --output-format Json
          npm --prefix frontend sbom --sbom-format cyclonedx | Out-File -Encoding utf8NoBOM sbom/frontend.cdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error
