<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Composer — Today</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0}
a{color:#5cc493}a:hover{color:#8ad9b2}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #111312; color: #ececea; font-family: 'DM Sans', system-ui, sans-serif; line-height: 1.4; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 16px 20px 14px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #262927">
    <div style="display: flex; align-items: center; gap: 8px">
      <h1 style="margin: 0; font-size: 20px; font-weight: 600">Today</h1>
      <span style="font-size: 14px; color: #a8a8a3">Wed 29 Oct</span>
      <button type="button" aria-label="History" style="margin-left: auto; width: 44px; height: 44px; border-radius: 12px; border: none; background: #1c1f1d; color: #ececea; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
      </button>
      <button type="button" aria-label="Account" style="width: 44px; height: 44px; border-radius: 12px; border: none; background: #1c1f1d; color: #ececea; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4-6 8-6s7 2 8 6"></path></svg>
      </button>
    </div>
    <div style="display: flex; align-items: baseline; gap: 6px">
      <span style="font-size: 40px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; color: {{accent}}">96</span>
      <span style="font-size: 16px; color: #a8a8a3">/ 150 g protein</span>
      <span style="margin-left: auto; font-size: 14px; color: #a8a8a3">1420 kcal · C 128 · F 46</span>
    </div>
    <div role="progressbar" aria-label="Protein toward goal" aria-valuemin="0" aria-valuemax="150" aria-valuenow="96" style="height: 6px; border-radius: 3px; background: #262927; overflow: hidden">
      <div style="width: 64%; height: 100%; background: {{accent}}; border-radius: 3px"></div>
    </div>
  </header>

  <ol aria-label="Entries" style="flex: 1; list-style: none; margin: 0; padding: 8px 20px; display: flex; flex-direction: column; gap: 2px; overflow: hidden">
    <sc-for list="{{entries}}" as="e" hint-placeholder-count="4">
      <li>
        <button type="button" style="width: 100%; min-height: 56px; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 0; border: none; background: none; font: inherit; color: #ececea; text-align: left">
          <span style="font-size: 13px; color: #a8a8a3; font-variant-numeric: tabular-nums">{{e.time}}</span>
          <span style="display: flex; flex-direction: column; min-width: 0">
            <span style="font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{e.name}}</span>
            <span style="font-size: 13px; color: #a8a8a3">{{e.detail}}</span>
          </span>
          <span style="font-weight: 600; font-variant-numeric: tabular-nums">{{e.protein}}</span>
        </button>
      </li>
    </sc-for>
  </ol>

  <section aria-label="Log food" style="background: #1a1d1b; border-top: 1px solid #262927; padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; gap: 8px; overflow: hidden">
      <span style="font-size: 13px; color: #a8a8a3; align-self: center; white-space: nowrap">Again:</span>
      <sc-for list="{{recents}}" as="r" hint-placeholder-count="3">
        <button type="button" style="min-height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #333734; background: none; color: #ececea; font: inherit; font-size: 14px; white-space: nowrap">{{r.label}}</button>
      </sc-for>
    </div>

    <sc-if value="{{isPhoto}}" hint-placeholder-val="{{ false }}">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button type="button" style="min-height: 72px; border-radius: 14px; border: 1px dashed #4a4f4b; background: none; color: #ececea; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Take photo</button>
        <button type="button" style="min-height: 72px; border-radius: 14px; border: 1px dashed #4a4f4b; background: none; color: #ececea; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path></svg>Choose photo</button>
      </div>
    </sc-if>
    <sc-if value="{{isText}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; gap: 8px; align-items: flex-end">
        <label style="flex: 1; display: flex">
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">What did you eat?</span>
          <textarea rows="1" placeholder="What did you eat? e.g. 2 eggs and toast" style="flex: 1; min-height: 48px; box-sizing: border-box; font: inherit; font-size: 16px; color: #ececea; background: #111312; border: 1px solid #333734; border-radius: 14px; padding: 12px 14px; resize: none"></textarea>
        </label>
        <button type="button" aria-label="Estimate" style="width: 48px; height: 48px; border-radius: 14px; border: none; background: {{accent}}; color: #0d1f17; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
        </button>
      </div>
    </sc-if>
    <sc-if value="{{isManual}}" hint-placeholder-val="{{ false }}">
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
        <label style="display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: #a8a8a3">Protein g<input inputmode="decimal" style="min-height: 44px; box-sizing: border-box; width: 100%; font: inherit; font-size: 16px; color: #ececea; background: #111312; border: 1px solid #333734; border-radius: 10px; padding: 0 8px"></label>
        <label style="display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: #a8a8a3">kcal<input inputmode="decimal" style="min-height: 44px; box-sizing: border-box; width: 100%; font: inherit; font-size: 16px; color: #ececea; background: #111312; border: 1px solid #333734; border-radius: 10px; padding: 0 8px"></label>
        <label style="display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: #a8a8a3">Carbs g<input inputmode="decimal" style="min-height: 44px; box-sizing: border-box; width: 100%; font: inherit; font-size: 16px; color: #ececea; background: #111312; border: 1px solid #333734; border-radius: 10px; padding: 0 8px"></label>
        <label style="display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: #a8a8a3">Fat g<input inputmode="decimal" style="min-height: 44px; box-sizing: border-box; width: 100%; font: inherit; font-size: 16px; color: #ececea; background: #111312; border: 1px solid #333734; border-radius: 10px; padding: 0 8px"></label>
      </div>
    </sc-if>

    <div role="group" aria-label="Entry method" style="display: flex; gap: 4px">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
        <button type="button" aria-pressed="{{m.pressed}}" onClick="{{m.pick}}" style="{{m.style}}">{{m.label}}</button>
      </sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5cc493","options":["#5cc493","#7aa7ff","#ffa366","#e5e5e0"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'text' };
  }
  renderVals() {
    const accent = this.props.accent ?? '#5cc493';
    const mode = this.state.mode;
    const base = 'min-height: 44px; padding: 0 14px; border-radius: 12px; border: none; font: inherit; font-size: 14px; ';
    const modes = [['text', 'Describe'], ['photo', 'Photo'], ['manual', 'Manual']].map(([id, label]) => ({
      label,
      pressed: mode === id ? 'true' : 'false',
      style: base + (mode === id ? 'background: #2a2e2b; color: #ececea; font-weight: 600' : 'background: none; color: #a8a8a3'),
      pick: () => this.setState({ mode: id })
    }));
    return {
      accent,
      modes,
      isText: mode === 'text',
      isPhoto: mode === 'photo',
      isManual: mode === 'manual',
      recents: [{ label: 'Protein shake' }, { label: 'Greek yogurt' }, { label: 'Burrito bowl' }],
      entries: [
        { time: '08:10', name: 'Greek yogurt with granola', detail: '1 serving · 310 kcal', protein: '22 g' },
        { time: '12:40', name: 'Chicken burrito bowl', detail: '1 serving · 640 kcal', protein: '46 g' },
        { time: '16:05', name: 'Protein shake', detail: '350 ml · 180 kcal', protein: '25 g' },
        { time: '16:30', name: 'Apple', detail: '180 g · 95 kcal', protein: '0.5 g' }
      ]
    };
  }
}
</script>
</body>
</html>
